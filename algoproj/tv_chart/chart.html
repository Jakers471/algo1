<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NQ — chart</title>
<style>
  :root { --bg:#0a0e13; --panel:#131a23; --border:#232e3a; --text:#e6edf3; --text2:#9aa7b4;
          --text3:#6b7886; --accent:#2dd4bf; --green:#34d399; --red:#f87171; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:13px/1.4 -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { display:flex; flex-direction:column; height:100%; }
  .bar { display:flex; align-items:center; gap:6px; padding:8px 12px;
         background:var(--panel); border-bottom:1px solid var(--border); }
  .bar .sym { font-weight:600; letter-spacing:.5px; margin-right:8px; }
  .bar .spacer { flex:1; }
  .bar .vtoggle { display:flex; align-items:center; gap:5px; margin-left:10px; color:var(--text2);
                  font-size:12px; cursor:pointer; user-select:none; }
  .bar .meta { color:var(--text2); font:11px/1 monospace; }
  .body { flex:1; min-height:0; display:flex; }
  #chart { flex:1; min-height:0; min-width:0; }
  button.tf, button.nav { background:transparent; color:var(--text2); border:1px solid var(--border);
              border-radius:6px; padding:5px 11px; cursor:pointer; font:12px/1 inherit; }
  button.tf:hover, button.nav:hover { color:var(--text); border-color:#2c3a48; }
  button.tf.on { color:var(--bg); background:var(--accent); border-color:var(--accent); font-weight:600; }

  /* right panel */
  #panel { width:264px; flex:none; background:var(--panel); border-left:1px solid var(--border);
           display:flex; flex-direction:column; }
  #panel .ph { padding:12px; overflow-y:auto; }
  #panel select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border);
                  border-radius:6px; padding:6px 8px; font:12px inherit; }
  #panel .total { margin-top:10px; font-size:12px; color:var(--text2); }
  #panel .total b { color:var(--text); font-size:15px; }
  #totals { margin-top:10px; padding:9px 10px; border:1px solid var(--border); border-radius:7px; background:#0e151d; }
  #totals .thead { font-size:10.5px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; }
  #totals .trow { margin-top:4px; font-size:12.5px; color:var(--text2); }
  #totals .trow b { font-size:16px; }
  #totals .tsub { margin-top:3px; font-size:11px; color:var(--text3); font-family:monospace; }
  #summary { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .grp { padding:7px 9px; border:1px solid var(--border); border-radius:7px; cursor:pointer; background:var(--bg); }
  .grp:hover { border-color:#2c3a48; }
  .grp.on { border-color:var(--accent); }
  .grp .gh { display:flex; align-items:center; gap:6px; font-size:12.5px; }
  .grp .gh .cnt { margin-left:auto; color:var(--text); font-weight:600; }
  .grp .gs { margin-top:3px; color:var(--text3); font-family:monospace; font-size:11px; }
  #timeline .tl-h { font-size:10.5px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; margin:12px 0 4px; }
  #timeline .tl-row { display:flex; align-items:center; gap:6px; font-size:10.5px; margin:1.5px 0; }
  #timeline .tl-row .lab { width:30px; color:var(--text2); font-family:monospace; text-align:right; }
  #timeline .tl-row .barwrap { flex:1; height:11px; background:#0e151d; border-radius:3px; overflow:hidden; }
  #timeline .tl-row .bar { display:block; height:100%; }
  #timeline .tl-row .val { width:30px; color:var(--text3); font-family:monospace; text-align:right; }
  #timeline details.tl { margin-top:12px; }
  #timeline summary { cursor:pointer; font-size:11px; color:var(--text2); padding:5px 0; list-style:none; user-select:none; }
  #timeline summary::-webkit-details-marker { display:none; }
  #timeline summary::before { content:'▸ '; color:var(--text3); }
  #timeline details[open] summary::before { content:'▾ '; }
  #timeline .tl-windows { display:flex; flex-direction:column; gap:4px; margin:4px 0 6px; }
  #timeline .tl-win { display:flex; align-items:baseline; gap:8px; font-size:11px; }
  #timeline .tl-win .yr { color:var(--text2); width:78px; }
  #timeline .tl-win b { color:var(--text); font-size:13px; }
  #timeline .tl-win .wk { margin-left:auto; font-family:monospace; }
  #panel .toggles { display:flex; gap:12px; margin-top:12px; color:var(--text2); font-size:12px; }
  #panel .toggles label { cursor:pointer; user-select:none; }
  #panel .legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  #panel .legend span { padding:2px 7px; border-radius:4px; font-size:11px; }
  #panel .legend .pole { background:rgba(76,141,255,0.22); color:#9ec1ff; }
  #panel .legend .flag { background:rgba(245,177,76,0.20); color:#ffd9a0; }
  #panel .legend .win  { background:rgba(52,211,153,0.22); color:#a7f3d6; }
  #panel .legend .loss { background:rgba(248,113,113,0.22); color:#ffc2c2; }
  #panel .hz { display:flex; align-items:center; gap:6px; margin-top:12px; font-size:12px; color:var(--text2); }
  #panel .hz select { width:auto; flex:1; }
  #panel .navrow { display:flex; gap:6px; margin-top:10px; }
  #panel .navrow button { flex:1; }
  #current { margin-top:12px; padding-top:10px; border-top:1px solid var(--border);
             font-size:12px; line-height:1.6; color:var(--text2); min-height:34px; }
  #current .pos { color:var(--text3); }
  #structPanel { margin-top:10px; }
  #structPanel .sh { font-size:11px; color:var(--text2); }
  #structPanel .struct-toggles { display:flex; flex-direction:column; gap:9px; margin-top:10px; }
  #structPanel label { cursor:pointer; font-size:13px; display:flex; align-items:center; gap:8px; user-select:none; }
  #structPanel .cnt2 { margin-left:auto; color:var(--text3); font-family:monospace; font-size:11px; }
  #indicators { margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border); }
  #indicators .ih { font-size:10.5px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  #indicators .ind { margin-top:7px; }
  #indicators .ind > label { display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; user-select:none; }
  #indicators .ind .swatch { width:10px; height:10px; border-radius:2px; flex:none; }
  #indicators .ind .params { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 0 26px; }
  #indicators .ind .params label { font-size:10.5px; color:var(--text3); display:flex; flex-direction:column; gap:2px; }
  #indicators .ind .params input { width:54px; background:var(--bg); color:var(--text); border:1px solid var(--border);
                                   border-radius:5px; padding:3px 6px; font:11px inherit; }
  #indicators .ind label.cc { display:flex; align-items:center; gap:6px; margin:6px 0 0 26px;
                              font-size:11px; color:var(--text3); cursor:pointer; user-select:none; }
  #patternFilter { margin-top:10px; }
  #patternFilter .pf-h { font-size:10.5px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
  #patternFilter .pf-row { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text2);
                           cursor:pointer; padding:2px 0; user-select:none; }
  #patternFilter .pf-row .pf-cnt { margin-left:auto; color:var(--text3); font-family:monospace; font-size:11px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="sym">NQ</span>
    <span id="tfs"></span>
    <label class="vtoggle"><input type="checkbox" id="tVol" checked> volume</label>
    <span class="spacer"></span>
    <span class="meta" id="meta"></span>
  </div>
  <div class="body">
    <div id="chart"></div>
    <div id="panel">
      <div class="ph">
        <div id="indicators"></div>
        <select id="findingSel"><option value="">— no findings —</option></select>
        <div id="structPanel"></div>
        <div class="total" id="total">Pick a findings file.</div>
        <div id="totals"></div>
        <div id="summary"></div>
        <div id="patternFilter"></div>
        <div id="timeline"></div>
        <div class="toggles">
          <label><input type="checkbox" id="tBands" checked> bands</label>
          <label><input type="checkbox" id="tMarks" checked> markers</label>
          <label><input type="checkbox" id="tAligned"> aligned only</label>
        </div>
        <div class="hz">forward <select id="hzSel"></select> bars</div>
        <div class="legend"><span class="pole">pole</span><span class="flag">flag</span><span class="win">won</span><span class="loss">failed</span></div>
        <div class="navrow">
          <button class="nav" id="prev">‹ prev</button>
          <button class="nav" id="next">next ›</button>
        </div>
        <div id="current"></div>
      </div>
    </div>
  </div>
</div>

<script src="lightweight-charts.standalone.production.js"></script>
<script>
const C = { bg:'#0a0e13', text2:'#9aa7b4', border:'#232e3a', grid:'#1c2733',
            green:'#34d399', red:'#f87171' };
const CHUNK = 15000, VISIBLE = 180, TRIGGER = 12, FRAME_PAD = 12, SNAP_LOAD = 700;
const POLE_C = 'rgba(76,141,255,0.22)';   // pole  (blue)
const FLAG_C = 'rgba(245,177,76,0.20)';   // flag  (amber)
const WIN_C  = 'rgba(52,211,153,0.20)';   // forward favorable (green)
const LOSS_C = 'rgba(248,113,113,0.20)';  // forward adverse  (red)
let horizon = '6';                        // forward horizon shown (key into match.fwd)
const DEBUG = true;                        // set false to silence the F12 console logs
const dbg = (...a) => { if (DEBUG) console.log('%c[chart]', 'color:#2dd4bf', ...a); };

// 12-hour time formatting in ET (America/New_York, DST-aware) for the axis ticks + crosshair.
// Display only — bar timestamps stay UTC epoch, so overlay/binary-search alignment is unaffected.
const _MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const _p2 = n => String(n).padStart(2, '0');
const _etParts = (() => {
  const f = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric',
    month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  return t => { const p = {}; for (const x of f.formatToParts(t * 1000)) p[x.type] = x.value;
    return { y: +p.year, mo: +p.month - 1, d: +p.day, h: (+p.hour) % 24, mi: +p.minute }; };
})();
function fmt12(t) { const { h, mi } = _etParts(t); const ap = h < 12 ? 'AM' : 'PM'; return `${h % 12 || 12}:${_p2(mi)} ${ap}`; }
function fmtDateTime12(t) { const { y, mo, d } = _etParts(t); return `${_MON[mo]} ${d}, ${y}  ${fmt12(t)}`; }

const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  autoSize: true,
  layout: { background: { color: C.bg }, textColor: C.text2, fontSize: 11 },
  grid:   { vertLines: { color: C.grid }, horzLines: { color: C.grid } },
  rightPriceScale: { borderColor: C.border },
  localization: { timeFormatter: fmtDateTime12 },          // crosshair label
  timeScale: { borderColor: C.border, timeVisible: true, secondsVisible: false,
    tickMarkFormatter: (t, type) => {                       // axis ticks (0=Year 1=Month 2=Day else=Time)
      const { y, mo, d } = _etParts(t);
      if (type === 0) return String(y);
      if (type === 1) return `${_MON[mo]} ${y}`;
      if (type === 2) return `${_MON[mo]} ${d}`;
      return fmt12(t);
    } },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
});
// band series first so candles render on top; lives on its own hidden full-height scale
const bands = chart.addHistogramSeries({ priceScaleId: 'bands', base: 0,
  priceLineVisible: false, lastValueVisible: false });
chart.priceScale('bands').applyOptions({ scaleMargins: { top: 0, bottom: 0 }, visible: false });
const series = chart.addCandlestickSeries({
  upColor: C.green, downColor: C.red, borderUpColor: C.green, borderDownColor: C.red,
  wickUpColor: C.green, wickDownColor: C.red,
});

// ── volume histogram, on its own scale pinned to the bottom ~18% (overlaps price) ──
const VOL_LOOKBACK = 20;          // bars of history for the "normal" volume baseline
const VOL_MULT = 2.0;             // spike = volume > VOL_MULT × recent average
const VOL_UP = 'rgba(52,211,153,0.45)', VOL_DN = 'rgba(248,113,113,0.45)';
const VOL_HI = '#facc15';         // high-volume highlight (amber) — bars + price candle
let volHiSet = new Set();         // bar times flagged as high-volume (for candle highlighting)
const volSeries = chart.addHistogramSeries({ priceScaleId: 'vol', priceFormat: { type: 'volume' },
  priceLineVisible: false, lastValueVisible: false });
chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
const volOn = () => document.getElementById('tVol').checked;

const toBar = d => ({ time: d[0], open: d[1], high: d[2], low: d[3], close: d[4], vol: d[5] });
const cache = new Map();   // tf -> { bars, hasOld, hasNew, last, loading }
let current = '5m';
let findings = null;       // { tf, matches:[...] }  sorted by start
let activeMatch = -1;
let snapping = false;      // suppress scroll-paging while we programmatically frame a match
// pole levels for the active match: top (red) / 0.5 (yellow) / bottom (green), drawn as
// horizontal SEGMENTS anchored at the pole and extending right (not full-chart price lines).
let fibSeries = [];
function fibSeg(i) {
  if (!fibSeries[i]) fibSeries[i] = chart.addLineSeries({ lineWidth: 1, priceLineVisible: false,
    lastValueVisible: false, crosshairMarkerVisible: false });
  return fibSeries[i];
}
function clearFib() { fibSeries.forEach(s => s.setData([])); }

// anchored VWAP center + band (the consolidation equilibrium the breakout is measured against),
// drawn for the active match from its emitted per-bar points ([time, center, up, dn]).
let vwapSeries = null;
function ensureVwap() {
  if (!vwapSeries) {
    const base = { priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false };
    vwapSeries = {
      center: chart.addLineSeries({ color: '#22d3ee', lineWidth: 2, ...base }),
      up: chart.addLineSeries({ color: '#22d3ee', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, ...base }),
      dn: chart.addLineSeries({ color: '#22d3ee', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, ...base }),
    };
  }
  return vwapSeries;
}
function clearVwap() { if (vwapSeries) { vwapSeries.center.setData([]); vwapSeries.up.setData([]); vwapSeries.dn.setData([]); } }
const hasRegime = () => !!(findings && findings.matches) && findings.matches.some(m => m.aligned != null);
// per-pattern visibility: muted patterns are hidden everywhere (overlays, summary, nav)
let patternMute = new Set();
const DEFAULT_SHOWN = ['rectangle', 'asc_triangle', 'pennant'];   // if a finding has these, show only these by default
const passFilter = m => !patternMute.has(m.pattern)
  && (!document.getElementById('tAligned').checked || !hasRegime() || m.aligned === true);
function initPatternFilter() {
  patternMute = new Set();
  if (!findings || !findings.matches) { renderPatternFilter([]); return; }
  const pats = [...new Set(findings.matches.map(m => m.pattern))];
  const anyDefault = pats.some(p => DEFAULT_SHOWN.includes(p));
  if (anyDefault) pats.forEach(p => { if (!DEFAULT_SHOWN.includes(p)) patternMute.add(p); });
  renderPatternFilter(pats);
}
function renderPatternFilter(pats) {
  const el = document.getElementById('patternFilter');
  if (!el) return;
  if (!findings || !pats || pats.length <= 1) { el.innerHTML = ''; return; }
  const counts = {};
  findings.matches.forEach(m => { counts[m.pattern] = (counts[m.pattern] || 0) + 1; });
  el.innerHTML = '<div class="pf-h">patterns</div>' + pats.sort().map(p =>
    `<label class="pf-row"><input type="checkbox" data-pat="${p}"${patternMute.has(p) ? '' : ' checked'}>`
    + `<span>${p}</span><span class="pf-cnt">${counts[p] || 0}</span></label>`).join('');
  el.querySelectorAll('input[data-pat]').forEach(cb => cb.onchange = () => togglePattern(cb.dataset.pat, cb.checked));
}
function togglePattern(p, on) {
  if (on) patternMute.delete(p); else patternMute.add(p);
  dbg('pattern', p, on ? 'shown' : 'muted', '| muted:', [...patternMute]);
  renderSummary();
  if (activeMatch >= 0 && !passFilter(findings.matches[activeMatch])) { const f = firstPassingIdx(); f >= 0 ? gotoMatch(f) : renderOverlays(); }
  else renderOverlays();
}

// ── trendline findings (flag_triangle): draw the fitted upper/lower lines, not a band ──
const TREND_MAX = 200;                     // cap how many patterns get lines at once
let trendPool = [];                        // pool of reusable 2-point line series
const isTrend = () => !!(findings && findings.matches && findings.matches.length && findings.matches[0].upper);
function trendSeries(i) {
  if (!trendPool[i]) trendPool[i] = chart.addLineSeries({ lineWidth: 1, priceLineVisible: false,
    lastValueVisible: false, crosshairMarkerVisible: false });
  return trendPool[i];
}
function clearTrend(from = 0) { for (let i = from; i < trendPool.length; i++) trendPool[i].setData([]); }
// draw lines only for patterns in the VISIBLE range (keeps it cheap while scrolling)
function redrawTrend() {
  if (!isTrend()) { clearTrend(); return; }
  let vr = null;
  try { vr = chart.timeScale().getVisibleRange(); } catch (e) { vr = null; }   // throws if scale not ready yet
  let list = findings.matches.filter(passFilter);
  if (vr) list = list.filter(m => m.end >= vr.from && m.start <= vr.to);
  let s = 0;
  for (const m of list.slice(0, TREND_MAX)) {
    const active = activeMatch >= 0 && findings.matches[activeMatch] === m;
    const col = m.side === 'long' ? C.green : m.side === 'short' ? C.red : '#4c8dff';
    for (const key of ['upper', 'lower']) {
      const pts = m[key]; if (!pts) continue;
      const ser = trendSeries(s++);
      ser.applyOptions({ color: col, lineWidth: active ? 3 : 1 });
      ser.setData(pts.map(([t, v]) => ({ time: t, value: v })));
    }
  }
  clearTrend(s);   // blank any unused pooled series
}
let trendRAF = 0;   // throttle trendline redraws to one per animation frame while panning
function scheduleTrend() { if (trendRAF) return; trendRAF = requestAnimationFrame(() => { trendRAF = 0; redrawTrend(); }); }

// ── structure_detection: swing lines per grain (a different findings type) ──
let structLines = {};
const STRUCT_COLORS = { LTF: '#6b7886', MTF: '#4c8dff', HTF: '#ffd700' };
const STRUCT_WIDTH = { LTF: 1, MTF: 2, HTF: 3 };
const isStruct = () => !!(findings && findings.grains);
function clearStructure() { Object.values(structLines).forEach(s => { try { chart.removeSeries(s); } catch (e) {} }); structLines = {}; }
function renderStructure() {
  if (!isStruct()) return;
  findings.grains.forEach(g => {
    const cb = document.getElementById('grain_' + g.name);
    if (!cb || cb.checked) {
      if (!structLines[g.name]) structLines[g.name] = chart.addLineSeries({
        color: STRUCT_COLORS[g.name] || '#4c8dff', lineWidth: STRUCT_WIDTH[g.name] || 2,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      structLines[g.name].setData(g.swings.map(s => ({ time: s.t, value: s.p })));
    } else if (structLines[g.name]) { chart.removeSeries(structLines[g.name]); delete structLines[g.name]; }
  });
}
function setupStructure(data) {
  document.getElementById('structPanel').innerHTML =
    `<div class="sh"><b style="color:var(--text)">structure</b> · ${data.tf} · toggle dimensions</div>`
    + '<div class="struct-toggles">' + data.grains.map(g =>
      `<label><input type="checkbox" id="grain_${g.name}" checked>`
      + `<span style="color:${STRUCT_COLORS[g.name] || '#fff'};font-weight:600">${g.name}</span>`
      + `<span class="cnt2">${g.swings.length.toLocaleString()} swings</span></label>`).join('') + '</div>';
  data.grains.forEach(g => { document.getElementById('grain_' + g.name).onchange = renderStructure; });
}
// show/hide the flag-pattern-only panel controls (forward horizon, legend, nav, stats)
function showFlagPanel(show) {
  ['#total', '#totals', '#summary', '#timeline', '#current', '.toggles', '.hz', '.legend', '.navrow']
    .forEach(sel => { const el = document.querySelector(sel); if (el) el.style.display = show ? '' : 'none'; });
}

const api = (u) => fetch(u).then(r => r.json());
const j = () => cache.get(current);

// binary search helpers over the loaded bars (ascending by .time)
function lb(bars, t) { let lo = 0, hi = bars.length; while (lo < hi) { const m = (lo + hi) >> 1; if (bars[m].time < t) lo = m + 1; else hi = m; } return lo; }

function showMeta() {
  const st = j(); const el = document.getElementById('meta');
  if (!st || !st.bars.length) { el.textContent = ''; return; }
  const last = st.bars[st.bars.length - 1];
  el.textContent = `${current} · ${st.bars.length.toLocaleString()} bars · last ${fmtDateTime12(last.time)} ET · ${last.close}`;
}

// ── indicators (Bollinger, FRAMA, …) — line overlays that page with the candles ──
const indState = {};   // name -> { active, params:{}, lines:{key: LineSeries}, spec }
function indLineStyle(s) {
  return s === 'dashed' ? LightweightCharts.LineStyle.Dashed
       : s === 'dotted' ? LightweightCharts.LineStyle.Dotted
       : LightweightCharts.LineStyle.Solid;
}
async function refreshIndicators() {
  const st = j(); if (!st || !st.bars.length) return;
  const t0 = st.bars[0].time, t1 = st.bars[st.bars.length - 1].time;
  for (const name in indState) {
    const S = indState[name]; if (!S.active) continue;
    const key = current + '|' + t0 + '|' + t1 + '|' + JSON.stringify(S.params);
    if (S.lastKey === key) continue;   // same range + params -> already drawn, skip refetch (scroll perf)
    const qs = new URLSearchParams({ tf: current, name, from: t0, to: t1, ...S.params });
    let data; try { data = await api('/indicator?' + qs.toString()); } catch (e) { continue; }
    S.lastKey = key;
    S.data = data.lines;   // keep raw values around for candle coloring
    if (S.spec.overlay !== false) for (const ln of S.spec.lines) {   // overlay:false = color-only (no lines drawn)
      let ser = S.lines[ln.key];
      if (!ser) {
        ser = chart.addLineSeries({ color: ln.color, lineWidth: ln.width || 1,
          lineStyle: indLineStyle(ln.style), priceLineVisible: false,
          lastValueVisible: false, crosshairMarkerVisible: false });
        S.lines[ln.key] = ser;
      }
      // null value -> whitespace point (breaks the line, so colored segments don't bridge gaps)
      ser.setData((data.lines[ln.key] || []).map(([t, v]) => (v == null ? { time: t } : { time: t, value: v })));
    }
  }
  applyCandleColors();
}

// ── volume histogram + high-volume detection ──
// A bar is "high volume" when its volume exceeds VOL_MULT × the trailing VOL_LOOKBACK average
// (single running-window pass, cheap enough to redo on every pan). Highlighted bars get the
// amber color here AND flag their time in volHiSet so applyCandleColors highlights the price.
function renderVolume() {
  const st = j(); volHiSet = new Set();
  if (!st || !st.bars.length || !volOn()) { volSeries.setData([]); return; }
  const bars = st.bars, n = bars.length, data = new Array(n);
  let sum = 0;
  for (let i = 0; i < n; i++) {
    const v = bars[i].vol || 0;
    sum += v;
    if (i >= VOL_LOOKBACK) sum -= bars[i - VOL_LOOKBACK].vol || 0;
    const cnt = Math.min(i + 1, VOL_LOOKBACK), avg = sum / cnt;
    const high = i >= 5 && v > VOL_MULT * avg;   // need a little history before calling a spike
    const up = bars[i].close >= bars[i].open;
    data[i] = { time: bars[i].time, value: v, color: high ? VOL_HI : (up ? VOL_UP : VOL_DN) };
    if (high) volHiSet.add(bars[i].time);
  }
  volSeries.setData(data);
}

// ── candle coloring: high-volume highlight (amber), then an indicator's bands on top ──
let candleColorer = null;   // name of the indicator currently coloring candles, or null
function clearCandleColors() { applyCandleColors(); }   // recompose (volume highlight may still apply)
function applyCandleColors() {
  const st = j(); if (!st || !st.bars.length) return;
  const S = candleColorer && indState[candleColorer];
  const cc = (S && S.active && S.data && S.spec.candles) ? S.spec.candles : null;
  const stateMode = cc && cc.mode === 'state';
  // band mode: close vs above/below lines; state mode: argmax of several score lines -> its color
  const above = cc && !stateMode ? new Map((S.data[cc.above] || []).filter(p => p[1] != null)) : null;
  const below = cc && !stateMode ? new Map((S.data[cc.below] || []).filter(p => p[1] != null)) : null;
  const stateMaps = stateMode ? cc.keys.map(k => new Map((S.data[k] || []).filter(p => p[1] != null))) : null;
  const volHi = volOn() && volHiSet.size ? volHiSet : null;
  if (!cc && !volHi) { series.setData(st.bars); return; }   // nothing to recolor
  const paint = (b, col) => ({ ...b, color: col, wickColor: col, borderColor: col });
  const colored = st.bars.map(b => {
    if (volHi && volHi.has(b.time)) return paint(b, VOL_HI);   // spike wins: make the price bar pop
    if (stateMode) {
      let bestK = null, bestV = -Infinity;
      for (let i = 0; i < cc.keys.length; i++) { const v = stateMaps[i].get(b.time); if (v != null && v > bestV) { bestV = v; bestK = cc.keys[i]; } }
      if (bestK) return paint(b, cc.colors[bestK]);
    } else if (cc) {
      const u = above.get(b.time), l = below.get(b.time);
      if (u != null && b.close > u) return paint(b, cc.up);
      if (l != null && b.close < l) return paint(b, cc.down);
    }
    return b;   // default green/red candle
  });
  series.setData(colored);
}
function setCandleColoring(name, on) {
  if (on) {
    candleColorer = name;
    // only one indicator colors candles at a time
    document.querySelectorAll('input[data-candle]').forEach(cb => { if (cb.dataset.candle !== name) cb.checked = false; });
    // coloring needs the indicator's bands -> make sure it's active
    const mainCb = document.querySelector(`#indicators input[type=checkbox][data-ind="${name}"]`);
    if (mainCb && !mainCb.checked) { mainCb.checked = true; setIndicatorActive(name, true); }
    refreshIndicators().then(applyCandleColors);
  } else if (candleColorer === name) {
    candleColorer = null; clearCandleColors();
  }
}
function setIndicatorActive(name, on) {
  const S = indState[name]; if (!S) return; S.active = on;
  if (!on) {
    for (const k in S.lines) { try { chart.removeSeries(S.lines[k]); } catch (e) {} } S.lines = {}; S.data = null; S.lastKey = null;
    if (candleColorer === name) {   // it was coloring candles -> stop and reset
      candleColorer = null; clearCandleColors();
      const cb = document.querySelector(`input[data-candle="${name}"]`); if (cb) cb.checked = false;
    }
  } else refreshIndicators();
}
function renderIndicatorPanel(list) {
  const host = document.getElementById('indicators');
  host.innerHTML = '<div class="ih">indicators</div>';
  list.forEach(spec => {
    indState[spec.name] = { active: false, params: { ...spec.params }, lines: {}, spec };
    const sw = spec.lines[0] ? spec.lines[0].color : 'var(--accent)';
    const pk = Object.keys(spec.params);
    const wrap = document.createElement('div'); wrap.className = 'ind';
    wrap.innerHTML =
      `<label><input type="checkbox" data-ind="${spec.name}">`
      + `<span class="swatch" style="background:${sw}"></span>${spec.label}</label>`
      + (pk.length ? `<div class="params">` + pk.map(k =>
          `<label>${k}<input type="number" step="any" data-ind="${spec.name}" data-param="${k}" value="${spec.params[k]}"></label>`
        ).join('') + `</div>` : '')
      + (spec.candles ? `<label class="cc"><input type="checkbox" data-candle="${spec.name}"> color candles</label>` : '');
    host.appendChild(wrap);
  });
  host.querySelectorAll('input[data-ind][type=checkbox]').forEach(cb =>
    cb.onchange = () => setIndicatorActive(cb.dataset.ind, cb.checked));
  host.querySelectorAll('input[data-candle]').forEach(cb =>
    cb.onchange = () => setCandleColoring(cb.dataset.candle, cb.checked));
  host.querySelectorAll('input[type=number]').forEach(inp =>
    inp.onchange = () => { const S = indState[inp.dataset.ind]; S.params[inp.dataset.param] = inp.value; if (S.active) refreshIndicators(); });
}

function renderOverlays() {
  renderVolume();        // recompute volume + spike set first, so candle coloring can highlight spikes
  refreshIndicators();   // indicators are independent of findings — keep them in sync on every redraw
  clearFib(); clearVwap();
  if (isStruct()) { bands.setData([]); series.setMarkers([]); clearTrend(); return; }   // structure lines are managed separately
  const st = j();
  if (!st || !st.bars.length || !findings || findings.tf !== current) { bands.setData([]); series.setMarkers([]); clearTrend(); return; }
  const lo = st.bars[0].time, hi = st.bars[st.bars.length - 1].time;
  const poleN = findings.pole_bars, fwdN = findings.fwd_window || 12;   // poleN null = variable span
  const vis = findings.matches.filter(m => m.end >= lo && m.start <= hi && passFilter(m));
  dbg('renderOverlays:', { current, findingsTf: findings.tf, total: findings.matches.length,
    visibleInWindow: vis.length, bands: document.getElementById('tBands').checked, marks: document.getElementById('tMarks').checked });
  const fwdOf = m => (m.fwd ? m.fwd[horizon] : undefined);

  // trendline findings (flag_triangle): draw the fitted lines instead of the shaded band
  const trend = isTrend();
  if (trend) { redrawTrend(); bands.setData([]); } else clearTrend();

  // bands: forward window first (green/red by outcome), setup painted on top (per-match span)
  if (!trend && document.getElementById('tBands').checked) {
    const m2c = new Map();
    for (const m of vis) {
      const fv = fwdOf(m); if (fv === undefined) continue;
      const col = fv >= 0 ? WIN_C : LOSS_C, a = lb(st.bars, m.end);
      for (let off = 1; off <= fwdN; off++) { const k = a + off; if (k >= st.bars.length) break; m2c.set(st.bars[k].time, col); }
    }
    for (const m of vis) {
      const a = lb(st.bars, m.start), b = lb(st.bars, m.end);   // paint the match's own span start..end
      let poleEnd;
      if (m.pole_end != null) poleEnd = lb(st.bars, m.pole_end);        // explicit pole/flag split
      else if (poleN != null) poleEnd = a + poleN - 1;                  // fixed-window template
      else poleEnd = b;                                                 // whole span = pole
      for (let k = a; k <= b && k < st.bars.length; k++) m2c.set(st.bars[k].time, k <= poleEnd ? POLE_C : FLAG_C);
    }
    bands.setData([...m2c.entries()].sort((p, q) => p[0] - q[0]).map(([t, color]) => ({ time: t, value: 1, color })));
  } else bands.setData([]);

  // markers: arrow at ENTRY (flag end), colored by outcome (won/failed); pole/flag labels on active match
  if (document.getElementById('tMarks').checked) {
    const marks = vis.filter(m => m.end >= lo && m.end <= hi).map(m => {
      const fv = fwdOf(m), col = fv === undefined ? C.text2 : (fv >= 0 ? C.green : C.red);
      return { time: m.end, position: m.side === 'long' ? 'belowBar' : 'aboveBar',
        color: col, shape: m.side === 'long' ? 'arrowUp' : 'arrowDown', text: '#' + m.rank };
    });
    const am = activeMatch >= 0 ? findings.matches[activeMatch] : null;
    if (!trend && am && am.start >= lo && am.end <= hi) {
      const a = lb(st.bars, am.start), b = lb(st.bars, am.end);
      marks.push({ time: st.bars[a].time, position: 'aboveBar', color: '#4c8dff', shape: 'circle', text: 'pole' });
      let flagIdx = null;                                    // only if there's a distinct flag region
      if (am.pole_end != null) { const pe = lb(st.bars, am.pole_end); if (pe < b) flagIdx = pe + 1; }
      else if (poleN != null) flagIdx = a + poleN;
      if (flagIdx != null && flagIdx <= b && flagIdx < st.bars.length)
        marks.push({ time: st.bars[flagIdx].time, position: 'aboveBar', color: '#f5b14c', shape: 'circle', text: 'flag' });
    }
    series.setMarkers(marks.sort((a, b) => a.time - b.time));
  } else series.setMarkers([]);

  // pole levels for the ACTIVE match, as horizontal SEGMENTS from the pole extending right
  // (top=red, 0.5=yellow, bottom=green) — shows whether the flag held these going forward.
  const af = activeMatch >= 0 ? findings.matches[activeMatch] : null;
  if (!trend && af && af.pole_lo != null && af.start >= lo && af.start <= hi) {
    const mid = (af.pole_lo + af.pole_hi) / 2;
    const t0 = af.start;                                        // left anchor = pole start
    const bEnd = lb(st.bars, af.end);                           // right anchor = flag end + fwd window
    const t1 = st.bars[Math.min(st.bars.length - 1, bEnd + fwdN)].time;
    const seg = (i, price, color) => {
      const s = fibSeg(i); s.applyOptions({ color });
      s.setData([{ time: t0, value: price }, { time: t1, value: price }]);
    };
    seg(0, af.pole_hi, C.red);      // top of pole
    seg(1, mid, '#ffd700');         // 0.5 fib
    seg(2, af.pole_lo, C.green);    // bottom of pole
    // anchored VWAP center + band across the consolidation (the breakout reference)
    if (af.vwap && af.vwap.length) {
      const v = ensureVwap();
      v.center.setData(af.vwap.map(p => ({ time: p[0], value: p[1] })));
      v.up.setData(af.vwap.map(p => ({ time: p[0], value: p[2] })));
      v.dn.setData(af.vwap.map(p => ({ time: p[0], value: p[3] })));
    } else clearVwap();
  } else { clearFib(); clearVwap(); }
}

async function load(tf) {
  current = tf;
  document.querySelectorAll('button.tf').forEach(b => b.classList.toggle('on', b.dataset.tf === tf));
  if (cache.has(tf)) { series.setData(cache.get(tf).bars); chart.timeScale().scrollToRealTime(); renderOverlays(); showMeta(); return; }
  document.getElementById('meta').textContent = 'loading…';
  const meta = await api(`/meta?tf=${tf}`);
  const { candles } = await api(`/candles?tf=${tf}&count=${CHUNK}`);
  const bars = candles.map(toBar);
  cache.set(tf, { bars, hasOld: candles.length === CHUNK, hasNew: false, last: meta.last, loading: false });
  series.setData(bars);
  const n = bars.length;
  chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - VISIBLE), to: n + 2 });
  renderOverlays(); showMeta();
}

async function loadOlder() {
  const st = j(); if (!st || !st.hasOld || st.loading) return; st.loading = true;
  const { candles } = await api(`/candles/before?tf=${current}&ts=${st.bars[0].time}&count=${CHUNK}`);
  st.loading = false; if (!candles.length) { st.hasOld = false; return; }
  const older = candles.map(toBar); st.bars = older.concat(st.bars);
  if (candles.length < CHUNK) st.hasOld = false;
  const r = chart.timeScale().getVisibleLogicalRange();
  series.setData(st.bars);
  if (r) chart.timeScale().setVisibleLogicalRange({ from: r.from + older.length, to: r.to + older.length });
  renderOverlays(); showMeta();
}

async function loadNewer() {
  const st = j(); if (!st || !st.hasNew || st.loading) return; st.loading = true;
  const { candles } = await api(`/candles/after?tf=${current}&ts=${st.bars[st.bars.length - 1].time}&count=${CHUNK}`);
  st.loading = false; if (!candles.length) { st.hasNew = false; return; }
  st.bars = st.bars.concat(candles.map(toBar));
  if (st.bars[st.bars.length - 1].time >= st.last) st.hasNew = false;
  series.setData(st.bars);          // appending keeps left indices stable
  renderOverlays(); showMeta();
}

// frame by TIMESTAMP (robust right after setData) rather than logical bar index
function frameMatch(m) {
  const bars = j().bars, fwdN = (findings && findings.fwd_window) || 12;
  const a = lb(bars, m.start), b = lb(bars, m.end);
  const i0 = Math.max(0, a - FRAME_PAD), i1 = Math.min(bars.length - 1, b + fwdN + FRAME_PAD);
  if (i1 > i0) chart.timeScale().setVisibleRange({ from: bars[i0].time, to: bars[i1].time });
}

async function gotoMatch(k) {
  if (!findings || k < 0 || k >= findings.matches.length) return;
  activeMatch = k; updateCurrent();
  const m = findings.matches[k];
  dbg('gotoMatch', k, '->', m.pattern, m.side, 'start', new Date(m.start * 1000).toISOString());
  if (current !== findings.tf) await load(findings.tf);
  snapping = true;
  let st = j();
  if (!(m.start >= st.bars[0].time && m.start <= st.bars[st.bars.length - 1].time)) {
    const { candles } = await api(`/candles/around?tf=${findings.tf}&ts=${m.start}&count=${SNAP_LOAD}`);
    const bars = candles.map(toBar);
    cache.set(findings.tf, { bars, hasOld: true, hasNew: bars[bars.length - 1].time < st.last, last: st.last, loading: false });
    series.setData(bars); showMeta();
  }
  renderOverlays();
  // let the new data commit, then frame; clear the snap guard a frame later
  requestAnimationFrame(() => { frameMatch(m); requestAnimationFrame(() => { snapping = false; }); });
}

// ── findings panel (condensed: per-pattern summary, not every match) ──
function renderSummary() {
  const total = document.getElementById('total'), summary = document.getElementById('summary');
  const totals = document.getElementById('totals');
  if (!findings) { total.textContent = 'Pick a findings file.'; totals.innerHTML = ''; summary.innerHTML = ''; document.getElementById('timeline').innerHTML = ''; updateCurrent(); return; }
  const ms = findings.matches.filter(passFilter);
  const alignOnly = hasRegime() && document.getElementById('tAligned').checked;
  total.innerHTML = `<b>${ms.length}</b> matches · ${findings.tf}${alignOnly ? ' · aligned' : ''}`;

  // ALL matches combined (both patterns) at the selected horizon
  const fwdAll = ms.map(m => m.fwd ? m.fwd[horizon] : undefined).filter(v => v !== undefined);
  const mfes = ms.map(m => m.mfe).filter(v => v != null), maes = ms.map(m => m.mae).filter(v => v != null);
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  if (fwdAll.length) {
    const sum = fwdAll.reduce((x, y) => x + y, 0), mu = sum / fwdAll.length;
    const won = fwdAll.filter(x => x > 0).length, failed = fwdAll.length - won;
    const win = won / fwdAll.length * 100;
    const sumCol = sum >= 0 ? C.green : C.red, muCol = mu >= 0 ? C.green : C.red;
    const allM = findings.matches, nAl = allM.filter(m => m.aligned).length;
    const regLine = hasRegime()
      ? `<div class="trow">${(findings.regime && findings.regime.htf) || 'HTF'} aligned <b style="color:${C.green}">${nAl}</b> · counter <b style="color:${C.red}">${allM.length - nAl}</b></div>`
      : '';
    totals.innerHTML = `<div class="thead">all ${fwdAll.length} matches · fwd${horizon}</div>` + regLine
      + `<div class="trow">won <b style="color:${C.green}">${won}</b> · failed <b style="color:${C.red}">${failed}</b> · ${win.toFixed(0)}% win</div>`
      + `<div class="trow">total <b style="color:${sumCol}">${sum >= 0 ? '+' : ''}${sum.toFixed(2)}%</b>`
      + ` · mean <span style="color:${muCol}">${mu >= 0 ? '+' : ''}${mu.toFixed(3)}%</span></div>`
      + `<div class="tsub">avg MFE ${mfes.length ? '+' + mean(mfes).toFixed(3) + '%' : '–'}`
      + ` · avg MAE ${maes.length ? mean(maes).toFixed(3) + '%' : '–'}</div>`;
  } else totals.innerHTML = '';
  const groups = {};
  findings.matches.forEach((m, i) => {          // iterate ALL so bestIdx stays a real findings index
    if (!passFilter(m)) return;
    const g = groups[m.pattern] || (groups[m.pattern] = { side: m.side, scores: [], fwd: [], best: Infinity, bestIdx: -1 });
    g.scores.push(m.score);
    const fv = m.fwd ? m.fwd[horizon] : undefined; if (fv !== undefined) g.fwd.push(fv);
    if (m.score < g.best) { g.best = m.score; g.bestIdx = i; }
  });
  summary.innerHTML = Object.entries(groups).map(([name, g]) => {
    const avg = g.scores.reduce((a, b) => a + b, 0) / g.scores.length;
    const arrow = g.side === 'long' ? '▲' : '▼', col = g.side === 'long' ? C.green : C.red;
    const fwdMean = g.fwd.length ? g.fwd.reduce((a, b) => a + b, 0) / g.fwd.length : null;
    const winPct = g.fwd.length ? g.fwd.filter(x => x > 0).length / g.fwd.length * 100 : null;
    const fwdCol = fwdMean == null ? C.text2 : (fwdMean >= 0 ? C.green : C.red);
    const fwdTxt = fwdMean == null ? '' :
      `<div class="gs">fwd${horizon}: <span style="color:${fwdCol}">${fwdMean >= 0 ? '+' : ''}${fwdMean.toFixed(3)}%</span> · win ${winPct.toFixed(0)}%</div>`;
    return `<div class="grp" data-idx="${g.bestIdx}" data-name="${name}">`
      + `<div class="gh"><span style="color:${col}">${arrow}</span> ${name}<span class="cnt">${g.scores.length}</span></div>`
      + `<div class="gs">best ${g.best.toFixed(4)} · avg ${avg.toFixed(4)}</div>${fwdTxt}</div>`;
  }).join('');
  summary.querySelectorAll('.grp').forEach(el => el.onclick = () => gotoMatch(+el.dataset.idx));
  renderTimeline();
  updateCurrent();
}

// collapsible activity breakdown: two-era avg/week + by-year + by-month (UTC buckets)
const SPLIT_YEAR = 2016;   // activity jumps here; split the history into two windows
function renderTimeline() {
  const el = document.getElementById('timeline');
  if (!findings) { el.innerHTML = ''; return; }
  const years = {}, months = new Array(12).fill(0);
  let minTs = Infinity, maxTs = -Infinity, w1 = 0, w2 = 0;
  for (const m of findings.matches) {
    if (!passFilter(m)) continue;
    const d = new Date(m.start * 1000), y = d.getUTCFullYear();
    years[y] = (years[y] || 0) + 1; months[d.getUTCMonth()]++;
    if (m.start < minTs) minTs = m.start;
    if (m.start > maxTs) maxTs = m.start;
    if (y < SPLIT_YEAR) w1++; else w2++;
  }
  const splitTs = Date.UTC(SPLIT_YEAR, 0, 1) / 1000;
  const wk = (a, b) => Math.max(1, (b - a) / (7 * 86400));
  const a1 = w1 / wk(minTs, Math.min(splitTs, maxTs)), a2 = w2 / wk(Math.max(splitTs, minTs), maxTs);
  const yKeys = Object.keys(years).map(Number).sort((a, b) => a - b);
  const minY = yKeys[0], maxY = yKeys[yKeys.length - 1];
  const yMax = Math.max(1, ...yKeys.map(y => years[y])), mMax = Math.max(1, ...months);
  const row = (label, n, max, color) =>
    `<div class="tl-row"><span class="lab">${label}</span>`
    + `<span class="barwrap"><span class="bar" style="width:${(n / max * 100).toFixed(1)}%;background:${color}"></span></span>`
    + `<span class="val">${n}</span></div>`;
  const winRow = (lab, n, avg, color) =>
    `<div class="tl-win"><span class="yr">${lab}</span><b>${n}</b>`
    + `<span class="wk" style="color:${color}">${avg.toFixed(2)}/wk</span></div>`;
  el.innerHTML = '<details class="tl"><summary>activity over time</summary>'
    + '<div class="tl-windows">'
    + winRow(`${minY}–${SPLIT_YEAR - 1}`, w1, a1, '#6b7886')
    + winRow(`${SPLIT_YEAR}–${maxY}`, w2, a2, '#2dd4bf')
    + '</div>'
    + '<div class="tl-h">by year</div>'
    + yKeys.map(y => row(y, years[y], yMax, y < SPLIT_YEAR ? '#3a4656' : '#4c8dff')).join('')
    + '<div class="tl-h">by month</div>'
    + _MON.map((mn, i) => row(mn, months[i], mMax, '#2dd4bf')).join('')
    + '</details>';
}

function updateCurrent() {
  const el = document.getElementById('current');
  document.querySelectorAll('#summary .grp').forEach(g =>
    g.classList.toggle('on', !!findings && activeMatch >= 0 && g.dataset.name === findings.matches[activeMatch].pattern));
  if (!findings || activeMatch < 0) { el.innerHTML = '<span class="pos">‹ prev / next › to step through matches</span>'; return; }
  const m = findings.matches[activeMatch];
  const d = fmtDateTime12(m.start) + ' ET';
  const col = m.side === 'long' ? C.green : C.red;
  const fv = m.fwd ? m.fwd[horizon] : undefined;
  const fwdCol = fv === undefined ? C.text2 : (fv >= 0 ? C.green : C.red);
  const fwdTxt = fv === undefined ? 'n/a' : `<span style="color:${fwdCol}">${fv >= 0 ? '+' : ''}${fv.toFixed(3)}%</span>`;
  const mfe = m.mfe == null ? '–' : `+${m.mfe.toFixed(3)}%`, mae = m.mae == null ? '–' : `${m.mae.toFixed(3)}%`;
  const rt = m.retrace;
  const rtTxt = rt == null ? '' :
    `<br>retrace ${(rt * 100).toFixed(0)}% ` +
    (rt <= 0.5 ? `<span style="color:${C.green}">held 0.5 ✓</span>` : `<span style="color:${C.red}">broke 0.5 ✗</span>`);
  const alTxt = m.aligned == null ? '' :
    `<br>regime ${m.regime} ` +
    (m.aligned ? `<span style="color:${C.green}">aligned ✓</span>` : `<span style="color:${C.red}">counter ✗</span>`);
  el.innerHTML = `<span style="color:${col}">${m.side === 'long' ? '▲' : '▼'} ${m.pattern} #${m.rank}</span><br>`
    + `${d} · score ${m.score.toFixed(4)} <span class="pos">(${activeMatch + 1}/${findings.matches.length})</span><br>`
    + `fwd${horizon}: ${fwdTxt} · MFE ${mfe} / MAE ${mae}${rtTxt}${alTxt}`;
}

async function selectFindings(name) {
  dbg('selectFindings ->', name || '(none)');
  clearStructure();
  document.getElementById('structPanel').innerHTML = '';
  if (!name) { findings = null; patternMute = new Set(); renderPatternFilter([]); showFlagPanel(true); renderSummary(); renderOverlays(); return; }
  const data = await api(`/findings/${name}`);
  dbg('findings loaded:', { source: data.source, tf: data.tf,
    matches: data.matches ? data.matches.length : undefined, grains: data.grains ? data.grains.length : undefined });
  findings = data; activeMatch = -1;
  if (data.grains) {                                  // ── structure_detection findings ──
    renderPatternFilter([]);
    showFlagPanel(false);
    setupStructure(data);
    await load(data.tf);
    renderStructure();
    return;
  }
  showFlagPanel(true);
  data.matches.sort((a, b) => a.start - b.start);     // ── flag-style findings (matches) ──
  const hzSel = document.getElementById('hzSel');
  const hs = (data.horizons && data.horizons.length) ? data.horizons : [1, 3, 6, 12, 24];
  if (!hs.map(String).includes(horizon)) horizon = String(hs.includes(6) ? 6 : hs[0]);
  hzSel.innerHTML = hs.map(h => `<option value="${h}"${String(h) === horizon ? ' selected' : ''}>${h}</option>`).join('');
  initPatternFilter();
  renderSummary();
  await load(findings.tf);
  const f = firstPassingIdx();
  f >= 0 ? gotoMatch(f) : renderOverlays();
}

document.getElementById('tBands').onchange = renderOverlays;
document.getElementById('tMarks').onchange = renderOverlays;
document.getElementById('tVol').onchange = () => { renderVolume(); applyCandleColors(); };
document.getElementById('hzSel').onchange = (e) => { if (isStruct()) return; horizon = e.target.value; renderOverlays(); renderSummary(); };
function firstPassingIdx() { if (!findings || !findings.matches) return -1; for (let i = 0; i < findings.matches.length; i++) if (passFilter(findings.matches[i])) return i; return -1; }
function stepMatch(dir) {
  if (!findings || !findings.matches) return;
  if (activeMatch < 0) { const f = firstPassingIdx(); if (f >= 0) gotoMatch(f); return; }
  let k = activeMatch;
  for (let s = 0; s < findings.matches.length; s++) { k += dir; if (k < 0 || k >= findings.matches.length) return; if (passFilter(findings.matches[k])) { gotoMatch(k); return; } }
}
document.getElementById('prev').onclick = () => stepMatch(-1);
document.getElementById('next').onclick = () => stepMatch(1);
document.getElementById('tAligned').onchange = () => {
  if (isStruct()) return;
  renderSummary();
  if (activeMatch >= 0 && !passFilter(findings.matches[activeMatch])) { const f = firstPassingIdx(); f >= 0 ? gotoMatch(f) : renderOverlays(); }
  else renderOverlays();
};
window.addEventListener('keydown', e => {
  if (!findings) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); document.getElementById('prev').click(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); document.getElementById('next').click(); }
});

chart.timeScale().subscribeVisibleLogicalRangeChange(r => {
  if (isTrend()) scheduleTrend();   // keep trendlines matched to the viewport while panning (throttled)
  if (snapping || !r) return; const st = j(); if (!st) return;
  if ((r.to - r.from) > 2000) return;   // zoomed too far out: don't runaway-page through history
  if (r.from < TRIGGER) loadOlder();
  if (r.to > st.bars.length - TRIGGER) loadNewer();
});

// ── boot ─────────────────────────────────────────────────
api('/indicators').then(list => { dbg('indicators loaded:', list.map(i => i.name)); renderIndicatorPanel(list); }).catch(e => dbg('indicators failed', e));
Promise.all([api('/timeframes'), api('/findings')]).then(([tfs, files]) => {
  dbg('findings files:', files.map(f => f.id));
  const host = document.getElementById('tfs');
  tfs.forEach(tf => {
    const b = document.createElement('button');
    b.className = 'tf'; b.dataset.tf = tf; b.textContent = tf;
    b.onclick = () => load(tf);
    host.appendChild(b);
  });
  const sel = document.getElementById('findingSel');
  files.forEach(f => { const o = document.createElement('option'); o.value = f.id; o.textContent = f.label; sel.appendChild(o); });
  sel.onchange = () => selectFindings(sel.value);
  load(tfs.includes('5m') ? '5m' : tfs[0]);
});
</script>
